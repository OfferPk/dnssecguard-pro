<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 500" width="1000" height="500">
  <defs>
    <linearGradient id="bgArchDns" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#050811"/>
      <stop offset="100%" stop-color="#020308"/>
    </linearGradient>
  </defs>

  <rect width="1000" height="500" fill="url(#bgArchDns)"/>

  <text x="500" y="45" fill="#ffffff" font-family="-apple-system, sans-serif" font-weight="700" font-size="20" text-anchor="middle">
    DNSSEC Architecture: Broken DS Chain Outages vs Double-DS Graceful Rollover
  </text>

  <!-- Left: Vulnerable Architecture -->
  <rect x="40" y="80" width="430" height="380" rx="10" fill="#140e18" stroke="#ef4444" stroke-width="1.5"/>
  <rect x="55" y="95" width="400" height="34" rx="6" fill="#ef4444" fill-opacity="0.2"/>
  <text x="255" y="118" fill="#f87171" font-family="-apple-system, sans-serif" font-weight="700" font-size="14" text-anchor="middle">
    Vulnerable: Broken DS &amp; Plain NSEC Zone-Walking
  </text>

  <rect x="55" y="145" width="400" height="60" rx="6" fill="#080c1a" stroke="#202b4e"/>
  <text x="70" y="170" fill="#fca5a5" font-family="monospace" font-size="11">Parent DS Tag #10045 != Child KSK #59124</text>
  <text x="70" y="190" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="11">Deprecated RSASHA1 (Alg 5) &bull; Plain NSEC allows zone dump</text>

  <rect x="55" y="220" width="400" height="220" rx="6" fill="#1c0f18" stroke="#ef4444" stroke-opacity="0.4"/>
  <text x="70" y="245" fill="#f87171" font-family="-apple-system, sans-serif" font-weight="700" font-size="12">OUTAGES &amp; ATTACK VECTORS:</text>
  <text x="70" y="275" fill="#fca5a5" font-family="-apple-system, sans-serif" font-size="11">&bull; KSK rotated without updating registrar parent DS</text>
  <text x="70" y="305" fill="#fca5a5" font-family="-apple-system, sans-serif" font-size="11">&bull; Resolvers (1.1.1.1, 8.8.8.8) hard-fail with SERVFAIL!</text>
  <text x="70" y="335" fill="#fca5a5" font-family="-apple-system, sans-serif" font-size="11">&bull; Plain NSEC linked-list exposes all internal subdomains</text>
  <text x="70" y="365" fill="#fca5a5" font-family="-apple-system, sans-serif" font-size="11">&bull; Attackers map vpn, admin, staging, and db hostnames</text>
  <text x="70" y="415" fill="#ef4444" font-family="-apple-system, sans-serif" font-weight="700" font-size="12">GLOBAL DOMAIN BLACKOUT &amp; ZONE LEAKAGE</text>

  <!-- Right: Hardened Architecture -->
  <rect x="530" y="80" width="430" height="380" rx="10" fill="#091826" stroke="#10b981" stroke-width="1.5"/>
  <rect x="545" y="95" width="400" height="34" rx="6" fill="#10b981" fill-opacity="0.2"/>
  <text x="745" y="118" fill="#34d399" font-family="-apple-system, sans-serif" font-weight="700" font-size="14" text-anchor="middle">
    Hardened: DNSSECGuard Pro Zero-Downtime Guard
  </text>

  <rect x="545" y="145" width="400" height="60" rx="6" fill="#080c1a" stroke="#202b4e"/>
  <text x="560" y="170" fill="#34d399" font-family="monospace" font-size="11">Double-DS Overlap &bull; Alg 13 ECDSA &bull; NSEC3 Hash</text>
  <text x="560" y="190" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="11">RFC 7344 CDS automated delegation + DANE TLSA SPKI pinning</text>

  <rect x="545" y="220" width="400" height="220" rx="6" fill="#071b22" stroke="#10b981" stroke-opacity="0.4"/>
  <text x="560" y="245" fill="#34d399" font-family="-apple-system, sans-serif" font-weight="700" font-size="12">ZERO-TRUST SECURITY GUARANTEES:</text>
  <text x="560" y="275" fill="#86efac" font-family="-apple-system, sans-serif" font-size="11">&bull; Double-DS window: Both old &amp; new KSK published simultaneously</text>
  <text x="560" y="305" fill="#86efac" font-family="-apple-system, sans-serif" font-size="11">&bull; 100% resolution uptime across all global validating caches</text>
  <text x="560" y="335" fill="#86efac" font-family="-apple-system, sans-serif" font-size="11">&bull; NSEC3 cryptographic hashes eliminate zone-walking leaks</text>
  <text x="560" y="365" fill="#86efac" font-family="-apple-system, sans-serif" font-size="11">&bull; DANE TLSA anchors TLS server certs directly to DNSSEC</text>
  <text x="560" y="415" fill="#10b981" font-family="-apple-system, sans-serif" font-weight="700" font-size="12">100% SERVICE AVAILABILITY &amp; AUTHENTICATED DNS</text>
</svg>
